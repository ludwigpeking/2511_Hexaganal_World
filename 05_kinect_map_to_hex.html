<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kinect Depth + Texture Mapping Test</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background-color: #1e1e1e;
                color: #f0f0f0;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0;
                padding: 20px;
            }

            h1 {
                margin-bottom: 10px;
            }

            .container {
                background-color: #2d2d2d;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
                text-align: center;
            }

            #canvas-container {
                border: 2px solid #444;
                background-color: #000;
            }

            .status-bar {
                margin-top: 15px;
                padding: 10px;
                background-color: #333;
                border-radius: 4px;
                font-family: monospace;
                color: #aaa;
                width: 100%;
                box-sizing: border-box;
            }

            .status-active {
                color: #4caf50;
                font-weight: bold;
            }
            .status-error {
                color: #f44336;
                font-weight: bold;
            }

            .info-panel {
                margin-top: 15px;
                padding: 10px;
                background-color: #333;
                border-radius: 4px;
                font-family: monospace;
                font-size: 0.9em;
                color: #ccc;
                text-align: left;
            }

            .info-row {
                margin: 5px 0;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🗺️ Kinect Depth + Texture Mapping Test</h1>

            <!-- The p5.js Canvas -->
            <div id="canvas-container"></div>

            <!-- Status Log -->
            <div id="status" class="status-bar">Loading...</div>

            <!-- Info Panel -->
            <div class="info-panel">
                <div class="info-row">
                    Map: <span id="map-info">Loading...</span>
                </div>
                <div class="info-row">
                    Kinect: <span id="kinect-info">Connecting...</span>
                </div>

                <div class="info-row">
                    Updates: <span id="update-count">0</span>
                </div>
            </div>
        </div>

        <!-- p5.js Library -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

        <!-- Our sketch -->
        <script src="05_kinect_map_to_hex.js"></script>
    </body>
</html>
