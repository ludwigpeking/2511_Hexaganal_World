<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Hex Map to GeoTIFF Mapper</title>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/geotiff@2.0.7/dist-browser/geotiff.js"
        ></script>
        <script defer src="16_marchingSquares.js"></script>
        <script defer src="03_hexToTiffMapper.js"></script>
        <style>
            body {
                display: block !important;
                overflow: auto;
                padding: 20px;
                background: #f0f0f0;
            }
            #controls {
                background: white;
                padding: 15px;
                margin-bottom: 20px;
            }
            #controls button {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                background: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
            }
            #controls button:hover {
                background: #0056b3;
            }
            #progress {
                margin-top: 10px;
                font-weight: bold;
                color: #333;
            }
            #canvas-container {
                background: white;
                padding: 20px;
                display: block;
                margin-bottom: 20px;
            }
            canvas {
                border: 1px solid #000;
                display: block;
            }
            #info {
                background: white;
                padding: 15px;
                margin-top: 20px;
                max-width: 800px;
            }
            .stat-row {
                margin: 5px 0;
            }
            .stat-label {
                font-weight: bold;
                display: inline-block;
                width: 200px;
            }
            #legend {
                background: white;
                padding: 15px;
                margin-top: 20px;
                max-width: 800px;
            }
            #legend-gradient {
                width: 100%;
                height: 30px;
                margin: 10px 0;
            }
            .legend-labels {
                display: flex;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <h1>Hex Map to GeoTIFF Mapper</h1>

        <div id="controls">
            <div style="margin-bottom: 15px">
                <label
                    for="tiffInput"
                    style="font-weight: bold; margin-right: 10px"
                    >Load GeoTIFF:</label
                >
                <input
                    type="file"
                    id="tiffInput"
                    accept=".tif,.tiff"
                    onchange="handleTiffUpload(event)"
                />
            </div>
            <button onclick="exportResults()">Export Results JSON</button>
            <div id="progress">Ready to load GeoTIFF...</div>
        </div>

        <div id="info">
            <h3>Mapping Information</h3>
            <div id="stats">Loading data...</div>
        </div>

        <div id="legend">
            <h3>Elevation Legend</h3>
            <div id="legend-gradient"></div>
            <div class="legend-labels">
                <span id="legend-min">Min</span>
                <span id="legend-max">Max</span>
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="mapCanvas" width="1920" height="1080"></canvas>
        </div>
    </body>
</html>
