<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Kinect Depth to Hex Mapper</title>
        <link rel="stylesheet" href="style.css" />
        <script src="16_marchingSquares.js"></script>
        <script src="06_kinect_depth_mapper.js"></script>
        <style>
            body {
                display: block;
                overflow: auto;
                padding: 20px;
                background: #f0f0f0;
            }
            #canvas-container {
                background: white;
                padding: 20px;
                display: inline-block;
            }
            canvas {
                border: 1px solid #000;
            }
            #info {
                background: white;
                padding: 15px;
                margin-top: 20px;
                max-width: 800px;
            }
            .stat-row {
                margin: 5px 0;
            }
            .stat-label {
                font-weight: bold;
                display: inline-block;
                width: 200px;
            }
            #legend {
                background: white;
                padding: 15px;
                margin-top: 20px;
                max-width: 800px;
            }
            #legend-gradient {
                width: 100%;
                height: 30px;
                margin: 10px 0;
            }
            .legend-labels {
                display: flex;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <h1>Kinect Depth to Hex Map Mapper</h1>

        <div id="controls">
            <button onclick="exportResults()">Export Results JSON</button>
            <div id="progress">Loading...</div>
        </div>

        <div id="canvas-container">
            <canvas id="mapCanvas" width="1920" height="1080"></canvas>
        </div>

        <div id="info">
            <h3>Mapping Information</h3>
            <div id="stats">Loading data...</div>
        </div>

        <div id="legend">
            <h3>Depth Legend</h3>
            <div id="legend-gradient"></div>
            <div class="legend-labels">
                <span id="legend-min">Min</span>
                <span id="legend-max">Max</span>
            </div>
        </div>
    </body>
</html>
